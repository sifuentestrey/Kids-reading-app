# Static deployment for the kids' tablets.
#
# ReadWithMe runs fine without its Express server: `soundService` falls back to
# the browser's built-in speech synthesis when `/api/tts` is not there. That
# costs the studio TTS voice and nothing else, so the client bundle on its own
# is a complete, playable app — no server to keep awake and no API key.
#
# Cloudflare Pages reads this file too. On Vercel, set the build command to
# `npm run build:static` and the output directory to `dist`.

# Declared explicitly rather than relying on the default. The functions
# directory must contain ONLY functions: Netlify treats every file in it as one,
# so a test file living there is enough to break the bundling step and leave the
# site deployed with no functions at all — which presents as a 404 on /api/tts
# and looks identical to the redirect being wrong. Tests live in tests/.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build]
  # The install step is explicit because the repository carries bun.lock while
  # .gitignore excludes package-lock.json, so leaving it to the host means
  # letting it guess which package manager this is. `npm install` resolves
  # without a lockfile; `npm ci` would abort for want of one.
  command = "npm install && npm run build:static"
  publish = "dist"

# Studio text-to-speech. This MUST come before the SPA catch-all below: redirects
# are matched top-down and first match wins, so with the catch-all first every
# /api/tts request would be answered with index.html and the app would silently
# fall back to the device voice.
[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

# One page, no router, but a stray deep link should still land on the app rather
# than a host 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Progress lives in localStorage, so a stale index.html would strand a child on
# an old bundle. Revalidate the entry point; the hashed assets under /assets are
# immutable and safe to keep.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
